services:
  # ---------------------------------------------------------------
  # ฐานข้อมูล PostgreSQL (โหลดข้อมูลเริ่มต้นจาก db/init ตอนสร้างครั้งแรก)
  # ---------------------------------------------------------------
  db:
    image: postgres:18-alpine
    container_name: equipment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?ต้องกำหนด DB_PASSWORD ในไฟล์ .env}
      POSTGRES_DB: ${DB_NAME:-equipment_db}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"   # ใช้ 5433 บนเครื่อง เพราะ 5432 ถูก PostgreSQL ของ Windows ใช้อยู่
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-equipment_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------
  # Backend API (Node.js + Express)
  # ---------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: equipment-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-equipment_db}
      JWT_SECRET: ${JWT_SECRET:?ต้องกำหนด JWT_SECRET ในไฟล์ .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  # ---------------------------------------------------------------
  # Frontend (React build เสิร์ฟด้วย Nginx)
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: equipment-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
